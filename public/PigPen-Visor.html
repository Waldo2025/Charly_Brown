<!doctype html>
<html lang="es-419">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11263d">
    <title>PigPen · Escape Room</title>
    <link rel="icon" href="pigpen.png">
    <link rel="stylesheet" href="local-fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="PigPen-Visor.css?v=20260901-share-viewer">
</head>
<body>
    <div class="pv-app-shell">
        <header class="pv-toolbar">
            <a class="pv-brand" href="PigPenCreator.html" aria-label="Ir a PigPen Creator">
                <span class="pv-brand-mark"><img src="pigpen.png" alt=""></span>
                <span class="pv-brand-copy">
                    <small>PigPen Escape Room</small>
                    <strong id="pvSessionTitle">Experiencia compartida</strong>
                </span>
            </a>
            <div class="pv-toolbar-actions">
                <label id="pvTopicField" class="pv-topic-field" hidden>
                    <span>Tema</span>
                    <select id="pvTopicSelect" aria-label="Seleccionar tema"></select>
                    <i class="fas fa-chevron-down" aria-hidden="true"></i>
                </label>
                <button type="button" id="pvFullscreenButton" class="pv-icon-button" aria-label="Ver en pantalla completa" title="Pantalla completa">
                    <i class="fas fa-expand" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <main class="pv-stage">
            <section id="pvLoading" class="pv-message-card" aria-live="polite">
                <div class="pv-loader" aria-hidden="true"><span></span><span></span><span></span></div>
                <p class="pv-eyebrow">Preparando la experiencia</p>
                <h1>Cargando escape room…</h1>
                <p>Estamos reuniendo las salas, preguntas e imágenes de esta sesión.</p>
            </section>

            <section id="pvError" class="pv-message-card pv-error-card" role="alert" hidden>
                <span class="pv-error-icon"><i class="fas fa-link-slash" aria-hidden="true"></i></span>
                <p class="pv-eyebrow">Enlace no disponible</p>
                <h1 id="pvErrorTitle">No pudimos abrir este escape room</h1>
                <p id="pvErrorMessage">Comprueba que el enlace esté completo e inténtalo de nuevo.</p>
                <button type="button" id="pvRetryButton" class="pv-primary-button">Volver a intentar</button>
            </section>

            <section id="pvGameShell" class="pv-game-shell" aria-label="Escape room compartido" hidden>
                <iframe id="pvGameFrame" title="Escape room" sandbox="allow-scripts allow-forms allow-modals allow-downloads" allow="fullscreen" allowfullscreen></iframe>
            </section>
        </main>
    </div>

    <script type="module" src="js/PigPen-Visor.js?v=20260901-share-viewer"></script>
</body>
</html>
