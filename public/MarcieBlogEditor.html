<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Marcie Blog Editor - Radar Editorial Educativo" />
  <title>Marcie Blog Editor</title>
  <script src="/js/runtime-config.js?v=20260831-marcie-r1"></script>

  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/MarcieBlogEditor/css/marcie-tailwind.css?v=20260923r1" />




  <!-- Font Awesome (requerido por el header y sidebar global) -->

  <!-- Header y Sidebar globales del proyecto -->
  <link rel="stylesheet" href="/header.css" />
  <link rel="stylesheet" href="/sidebar.css" />

  <!-- Estilos complementarios para resizers, shadcn y adaptación de layout -->
  <link rel="stylesheet" href="/MarcieBlogEditor/css/MarcieBlogEditor.css?v=20260924r6" />
  <link rel="stylesheet" href="/MarcieBlogEditor/css/marcie-templates.css?v=20260924r2" />



  <!-- Iconos del sidebar global (Font Awesome local) -->
  <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.33.0/dist/umd/lucide.min.js" integrity="sha384-tCQ4YYVYKuOFYH+pnSIPOS3PaT3+5AmX2okMauzDJlLLxkQfJfSwmgpZPceZWs1F" crossorigin="anonymous"></script>
  <script src="/MarcieBlogEditor/js/marcie-theme-init.js?v=20260923r1"></script>
</head>
<body data-page="MarcieBlogEditor.html" class="bg-[#f8fafc] text-foreground font-sans antialiased h-screen overflow-hidden">

  <!-- Header Principal Global de CharlyBrown -->
  <header class="main-header">
    <div class="header-content">
      <!-- header-content loaded from chromeLayout.js -->
    </div>
  </header>

  <!-- Sidebar Principal Global de CharlyBrown -->
  <div id="sidebar">

    <div class="sidebar-menu">
      <!-- sidebar-menu loaded from chromeLayout.js -->
    </div>
  </div>

  <!-- Contenedor de Marcie Blog Editor que adapta su ancho y alto automáticamente -->
  <div id="marcieAppRoot">

    <!-- Topbar secundario de la herramienta Marcie -->
    <header class="h-14 flex items-center justify-between px-6 bg-white border-b border-border shrink-0 relative z-[100]">
      <div class="flex items-center gap-3 w-[260px] shrink-0">
        <img src="/MarcieBlogEditorLogo2.png" alt="Marcie logo" class="w-8 h-8 object-contain rounded-md shadow-xs" />
        <span class="font-bold text-slate-900 text-base tracking-tight">Marcie Blog Editor</span>
      </div>


      <div class="flex items-center gap-2 justify-end shrink-0 relative">
	        <button
	          id="btn-trend-radar-header"
	          class="marcie-trend-header-button btn h-9 px-3 flex items-center justify-center gap-2 rounded-lg border border-purple-200 bg-purple-50 text-purple-700 shadow-xs transition-all hover:border-purple-300 hover:bg-purple-100"
	          type="button"
	          title="Buscar tendencias educativas emergentes"
	          aria-label="Abrir el radar y buscar tendencias educativas emergentes"
	          aria-haspopup="dialog"
	        >
	          <i data-lucide="radar" class="w-4 h-4" aria-hidden="true"></i>
	          <span>Radar de tendencias</span>
	        </button>
	        <button
	          id="btn-ui-theme"
	          class="marcie-ui-theme-toggle btn h-9 w-9 p-0 flex items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-600 shadow-xs transition-all hover:border-slate-300 hover:bg-slate-100"
	          type="button"
	          title="Tema Claro. Cambiar a Medio"
	          aria-label="Tema actual: Claro. Cambiar a Medio"
	        >
	          <svg data-marcie-theme-icon="light" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
	          <svg data-marcie-theme-icon="medium" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16V4Z" fill="currentColor" stroke="none"></path></svg>
	          <svg data-marcie-theme-icon="dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.1 15.3A8.5 8.5 0 0 1 8.7 3.9 8.5 8.5 0 1 0 20.1 15.3Z"></path></svg>
	        </button>
	        <button
	          id="btn-fullscreen-article"
	          class="btn h-9 w-9 p-0 flex items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-600 shadow-xs transition-all hover:border-slate-300 hover:bg-slate-100"
	          title="Pantalla completa"
	          aria-label="Abrir pantalla completa incluyendo el header"
	        >
	          <i data-lucide="maximize" class="w-4 h-4"></i>
	        </button>
	        <button
	          id="btn-header-options"
	          class="btn btn-ghost h-9 w-9 p-0 flex items-center justify-center transition-all rounded-lg"
	          title="Opciones de herramienta"
	          aria-label="Abrir opciones de herramienta"
	        >
          <i data-lucide="more-vertical" class="w-5 h-5 text-slate-500"></i>
        </button>

        <!-- Dropdown Menu -->
        <div id="header-options-menu" class="hidden absolute right-0 top-full mt-2 w-60 bg-white border border-slate-200 rounded-lg shadow-xl py-1 z-[120] animate-in fade-in slide-in-from-top-2">

          <div class="px-4 py-2.5 border-b border-slate-100 flex items-center gap-2 text-xs font-bold text-slate-500 tracking-wider">
            <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
            <span id="sync-status">Sincronizado</span>
          </div>

          <div class="py-1">
            <button id="btn-ia-topbar" class="w-full text-left px-4 py-2.5 text-xs font-medium text-purple-700 hover:bg-purple-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="sparkles" class="w-4 h-4 text-purple-500"></i> Asistente IA
            </button>
            <button id="btn-editorial-calendar" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="calendar-days" class="w-4 h-4 text-teal-600"></i> Calendario editorial
            </button>
            <button id="btn-editorial-trends" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="radar" class="w-4 h-4 text-purple-600"></i> Radar de tendencias
            </button>

            <button id="opt-gemini-model" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="settings-2" class="w-4 h-4 text-slate-400"></i>
              <span class="flex-1">Modelo de Marcie</span>
              <span id="header-gemini-model-badge" class="max-w-20 truncate rounded bg-emerald-50 px-1.5 py-0.5 text-[9px] font-bold text-emerald-700">Flash Lite</span>
            </button>

            <button id="btn-notification-topbar" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors relative">
              <i data-lucide="bell" class="w-4 h-4 text-slate-400"></i> Notificaciones
              <span class="absolute right-4 top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-teal-500 rounded-full"></span>
            </button>
          </div>

          <div class="h-px bg-slate-100"></div>

          <div class="py-1">
            <button id="user-avatar" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <div class="w-5 h-5 bg-teal-700 text-white rounded-full flex items-center justify-center font-bold text-[8px] shrink-0">MB</div>
              <span class="truncate">Cerrar sesión</span>
            </button>
          </div>
        </div>
      </div>
    </header>

  <!-- Main Workspace -->
  <main class="flex flex-1 overflow-hidden">

    <!-- Left Panel: Sesiones y artículos -->
    <aside id="left-panel" class="w-[320px] bg-[#fbfcfd] border-r border-border flex flex-col shrink-0 relative">
      <header class="p-4 flex flex-col gap-3.5 border-b border-border/70">
        <!-- Título Sesiones e Iconos -->
        <div class="flex items-center justify-between">
          <h2 class="font-normal text-slate-800 text-base tracking-tight">Sesiones</h2>
          <div class="flex items-center gap-1.5 text-slate-500">
	            <button
	              id="btn-toggle-search"
	              class="p-1.5 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition-all cursor-pointer"
	              title="Buscar sesiones"
	              aria-label="Mostrar campo de búsqueda de sesiones"
	            >
              <i data-lucide="search" class="w-4 h-4"></i>
            </button>
	            <button
	              id="btn-new-session"
	              class="p-1.5 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition-all cursor-pointer"
	              title="Nueva sesión"
	              aria-label="Crear nueva sesión"
	            >
	              <i data-lucide="plus" class="w-4 h-4"></i>
	            </button>
	            <button
	              id="btn-archive-sessions"
	              class="p-1.5 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition-all cursor-pointer"
	              title="Archivadas"
	              aria-label="Filtrar sesiones archivadas"
	            >
              <i data-lucide="archive" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Buscador (oculto por defecto) -->
        <div id="session-search-container" class="relative hidden">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i>
          <input type="text" id="session-search" placeholder="Buscar sesiones o artículos..." class="input-field pl-9 h-9 text-sm w-full" />
        </div>

        <!-- Pestañas de filtro originales -->
        <div class="session-filter-tabs grid grid-cols-5 w-full overflow-hidden rounded-lg border border-slate-200 divide-x divide-slate-200 bg-white pb-0">
          <button data-filter="all" title="Todos" aria-label="Mostrar todas las sesiones" aria-pressed="true" class="session-filter-tab is-active w-full min-w-0 px-1.5 py-1.5 text-[10px] tracking-wide font-bold shadow-xs transition-all cursor-pointer">TO</button>
          <button data-filter="recent" title="Recientes" aria-label="Mostrar sesiones recientes" aria-pressed="false" class="session-filter-tab w-full min-w-0 px-1.5 py-1.5 text-[10px] tracking-wide font-medium transition-all cursor-pointer">RE</button>
          <button data-filter="draft" title="Borradores" aria-label="Mostrar sesiones en borrador" aria-pressed="false" class="session-filter-tab w-full min-w-0 px-1.5 py-1.5 text-[10px] tracking-wide font-medium transition-all cursor-pointer">BO</button>
          <button data-filter="review" title="En revisión" aria-label="Mostrar sesiones en revisión" aria-pressed="false" class="session-filter-tab w-full min-w-0 px-1.5 py-1.5 text-[10px] tracking-wide font-medium transition-all cursor-pointer">RV</button>
          <button data-filter="published" title="Publicados" aria-label="Mostrar sesiones publicadas" aria-pressed="false" class="session-filter-tab w-full min-w-0 px-1.5 py-1.5 text-[10px] tracking-wide font-medium transition-all cursor-pointer">PU</button>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-3 flex flex-col justify-between">
        <div id="session-list" class="flex flex-col gap-2">
          <!-- Generado dinámicamente desde Firestore -->
        </div>
        <button id="btn-see-more-sessions" class="text-xs font-medium text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1 w-full py-3 mt-4 border-t border-slate-100">
          Ver todas las sesiones <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </aside>

    <!-- Resizer Izquierdo -->
    <div id="left-resizer" class="panel-resizer panel-resizer-left" role="separator" aria-orientation="vertical" aria-label="Redimensionar panel de sesiones" title="Arrastra para redimensionar (Doble clic para restaurar)"></div>

    <!-- Contenedor para Fullscreen -->
    <div id="workspace-fullscreen-area" class="flex flex-1 overflow-hidden relative bg-white">

      <!-- Center Panel: Contenido generado -->
      <section id="center-panel" class="center-panel flex-1 bg-white flex flex-col min-w-0 relative shadow-[0_0_40px_rgba(0,0,0,0.03)] z-10">
      <div class="h-11 px-3 sm:px-5 py-1.5 border-b border-border flex items-center justify-between gap-2 min-w-0 shrink-0">
        <h1 class="editor-toolbar-title text-base font-normal flex items-center gap-2 text-slate-800 min-w-0 truncate">
          <span class="truncate">Contenido generado</span>
        </h1>
        <div class="editor-toolbar-actions flex items-center gap-0.5 sm:gap-1 relative shrink-0">
        <button
            id="btn-automation-progress"
            type="button"
            class="btn h-8 px-2.5 flex items-center justify-center gap-1.5 rounded-lg text-xs font-semibold hidden"
            title="Marcie está generando tu producción — clic para ver el progreso"
            aria-label="Ver progreso de generación automatizada"
          >
            <i data-lucide="sparkles" class="automation-toolbar-icon" aria-hidden="true">✦</i>
            <span class="automation-toolbar-spinner" aria-hidden="true"></span>
            <span class="automation-toolbar-label">Generando…</span>
          </button>
          <button
            id="btn-reconfigure-session-header"
            type="button"
            class="btn btn-ghost h-8 px-2 flex items-center justify-center gap-1.5 rounded-lg text-xs text-slate-600 hover:text-slate-900 hover:bg-slate-100 border-0 border-transparent disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer"
            title="Modificar la configuración y volver a generar esta misma sesión editorial"
            aria-label="Configurar y volver a crear esta sesión editorial"
            aria-haspopup="dialog"
            disabled
          >
            <i data-lucide="settings-2" class="w-4 h-4 text-slate-500"></i>
            <span class="reconfigure-text hidden xl:inline">Configurar y volver a crear</span>
          </button>
          <button
            id="btn-toggle-right-panel-fullscreen"
            class="editor-toolbar-action editor-toolbar-action--panel btn h-8 w-8 p-0 flex items-center justify-center rounded-lg border-0 border-transparent"
            title="Mostrar/Ocultar panel del asistente"
            aria-label="Mostrar u ocultar panel lateral de asistente"
          >
            <i data-lucide="panel-right" class="w-4 h-4"></i>
          </button>
          <button
            id="btn-toggle-subheader"
            class="editor-toolbar-action editor-toolbar-action--view btn h-8 w-8 p-0 flex items-center justify-center rounded-lg border-0 border-transparent"
            title="Mostrar/Ocultar opciones de vista"
            aria-label="Mostrar u ocultar subheader"
          >
            <i data-lucide="chevrons-up-down" class="w-4 h-4"></i>
          </button>
          <button
            id="btn-article-options"
            class="editor-toolbar-action editor-toolbar-action--more btn h-8 w-8 p-0 flex items-center justify-center rounded-lg border-0 border-transparent"
            title="Opciones del artículo"
            aria-label="Abrir opciones del artículo"
          >
            <i data-lucide="more-vertical" class="w-5 h-5"></i>
          </button>

          <div id="article-options-menu" class="hidden absolute right-0 top-full mt-2 w-56 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50 animate-in fade-in slide-in-from-top-2">
            <button id="btn-copy-article" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="copy" class="w-4 h-4 text-slate-400"></i> Copiar texto
            </button>
            <button id="btn-share-article" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="share-2" class="w-4 h-4 text-slate-400"></i> Compartir enlace
            </button>
            <div class="h-px bg-slate-100 my-1"></div>
            <button id="opt-text-settings" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="type" class="w-4 h-4 text-slate-400"></i> Apariencia del texto
            </button>
            <div class="h-px bg-slate-100 my-1"></div>
            <button id="opt-copy-json" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="code" class="w-4 h-4 text-slate-400"></i> Copiar JSON crudo
            </button>
            <button id="opt-copy-html" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="clipboard" class="w-4 h-4 text-slate-400"></i> Copiar HTML
            </button>
            <button id="opt-export-html" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="file-down" class="w-4 h-4 text-slate-400"></i> Exportar
            </button>
            <button id="opt-export-md" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i> Exportar a Markdown
            </button>
            <div class="h-px bg-slate-100 my-1"></div>
            <button id="opt-create-video-script" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="clapperboard" class="w-4 h-4 text-rose-500"></i> Crear guión de video
            </button>
            <button id="opt-view-video-scripts" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors hidden">
              <i data-lucide="video" class="w-4 h-4 text-purple-600"></i> Ver guiones de video
            </button>
            <div class="h-px bg-slate-100 my-1"></div>
            <button id="opt-publish-wordpress" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i data-lucide="send" class="w-4 h-4 text-slate-400"></i> Publicar en WordPress
            </button>
          </div>
        </div>
      </div>

      <div id="center-subheader" class="px-4 sm:px-6 md:px-8 py-2 sm:py-2.5 border-b border-border flex flex-wrap items-center justify-between gap-3 bg-slate-50/50 transition-all duration-200">
        <div class="flex items-center gap-1.5 text-xs font-medium text-slate-500" id="audience-selector">
          <span class="audience-selector-label mr-1 uppercase tracking-wider text-[10px] font-bold text-slate-400 shrink-0">Público:</span>
          <div class="audience-buttons-grid flex items-center gap-1">
            <button data-audience="students" class="audience-btn px-3 py-1.5 rounded-full text-slate-500 hover:bg-slate-100 border-0 border-transparent shrink-0 transition-all cursor-pointer flex items-center gap-1.5">
              <i data-lucide="user" class="w-3.5 h-3.5"></i> Estudiantes
            </button>
            <button data-audience="parents" class="audience-btn px-3 py-1.5 rounded-full text-slate-500 hover:bg-slate-100 border-0 border-transparent shrink-0 transition-all cursor-pointer flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i> Padres
            </button>
            <button data-audience="educators" class="audience-btn px-3 py-1.5 rounded-full bg-purple-100/80 text-purple-800 border-0 border-transparent shrink-0 transition-all cursor-pointer font-bold shadow-none flex items-center gap-1.5">
              <i data-lucide="users" class="w-3.5 h-3.5"></i> Docentes
            </button>
            <button data-audience="coordinators" class="audience-btn px-3 py-1.5 rounded-full text-slate-500 hover:bg-slate-100 border-0 border-transparent shrink-0 transition-all cursor-pointer flex items-center gap-1.5">
              <i data-lucide="network" class="w-3.5 h-3.5"></i> Coordinadores
            </button>
          </div>
          <span class="mx-1 h-5 w-px bg-slate-200 shrink-0" aria-hidden="true"></span>
          <button id="btn-cycle-view" type="button" data-current-view="article" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border-0 border-transparent bg-teal-50/80 text-teal-700 shadow-none transition-all hover:bg-teal-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2 cursor-pointer" title="Artículo · Cambiar a Vista estructurada" aria-label="Vista actual: Artículo. Cambiar a Vista estructurada">
            <i data-lucide="layers-3" class="h-4 w-4"></i>
          </button>
        </div>
      </div>

      <!-- Toolbar Flotante para Edición -->
      <div id="inline-toolbar" class="hidden absolute z-[99999] bg-slate-900 text-white rounded-lg shadow-xl flex items-center p-1 gap-1 -translate-x-1/2 -mt-12 transition-opacity">
        <button
          id="it-bold"
          class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors"
          title="Negrita (⌘B)"
          aria-label="Negrita"
        ><i data-lucide="bold" class="w-4 h-4"></i></button>
          <button
            id="it-italic"
            class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors"
            title="Cursiva (⌘I)"
            aria-label="Cursiva"
          ><i data-lucide="italic" class="w-4 h-4"></i></button>
          <button
            id="it-underline"
            class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors"
            title="Subrayado (⌘U)"
            aria-label="Subrayado"
          ><i data-lucide="underline" class="w-4 h-4"></i></button>
        <div class="w-px h-5 bg-slate-700 mx-1"></div>
        <button type="button" id="it-paragraph" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors" title="Párrafo" aria-label="Estilo párrafo"><i data-lucide="pilcrow" class="w-4 h-4"></i></button>
        <button id="it-h2" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors text-xs font-bold" title="Subtítulo">H2</button>
        <button id="it-h3" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-700 transition-colors text-xs font-bold" title="Sección">H3</button>
        <div class="w-px h-5 bg-slate-700 mx-1"></div>
        <button id="it-ai-edit" class="h-8 px-2.5 flex items-center justify-center gap-1.5 rounded bg-purple-600 hover:bg-purple-500 text-white transition-colors text-xs font-semibold cursor-pointer shadow-sm" title="Analizar selección">
          <i data-lucide="sparkles" class="w-3 h-3"></i> Analizar
        </button>
      </div>

      <!-- Toolbar de Bloque para Analizar Párrafos -->
      <div id="block-ai-toolbar" class="hidden absolute z-[99999] right-2 -top-3">
        <button id="btn-block-ai-edit" class="h-7 px-2 flex items-center justify-center gap-1.5 rounded-full bg-white border border-slate-200 text-purple-600 shadow-sm hover:bg-purple-50 transition-colors text-[10px] font-bold cursor-pointer" title="Analizar bloque">
          <i data-lucide="sparkles" class="w-3 h-3"></i> Analizar
        </button>
      </div>

      <!-- Vista 1: Artículo (Formato Lectura / Render) -->
        <div id="editorial-guide-view" class="flex-1 overflow-y-auto px-12 py-8 max-w-4xl mx-auto w-full relative bg-white hidden border-0">
        <div id="article-guide-shell" class="article-guide-shell mt-2 text-left rounded-2xl bg-transparent p-6 border-0"></div>
      </div>

      <div id="article-view" class="article-template-surface flex-1 overflow-y-auto px-12 py-8 max-w-4xl mx-auto w-full relative bg-white">
        <article class="prose prose-slate max-w-none">
          <h1 id="article-title" data-article-title class="text-slate-900 tracking-tight mb-5 outline-none focus:ring-2 focus:ring-teal-100 rounded px-1 -mx-1 transition-colors" contenteditable="true" spellcheck="false"></h1>
          <p id="article-subtitle" data-article-subtitle class="text-slate-500 mb-8 leading-relaxed outline-none focus:ring-2 focus:ring-teal-100 rounded px-1 -mx-1 transition-colors" contenteditable="true" spellcheck="false"></p>

          <div data-article-meta-row class="flex flex-wrap items-center gap-3 text-sm text-slate-600 mb-8">
            <div class="flex items-center gap-1.5 bg-sky-50 text-sky-700 px-3 py-1.5 rounded-md font-medium border border-sky-100 shadow-xs"><i data-lucide="calendar" class="w-4 h-4 text-sky-500"></i> <span id="article-meta-date"></span></div>
            <div class="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-md font-medium border border-amber-100 shadow-xs"><i data-lucide="user" class="w-4 h-4 text-amber-500"></i> <span id="article-meta-author"></span></div>
            <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-md font-medium border border-emerald-100 shadow-xs"><i data-lucide="clock" class="w-4 h-4 text-emerald-500"></i> <span id="article-meta-readtime"></span></div>
            <div class="flex items-center gap-1.5 bg-violet-50 text-violet-700 px-3 py-1.5 rounded-md font-medium border border-violet-100 shadow-xs"><i data-lucide="tag" class="w-4 h-4 text-violet-500"></i> <span id="article-meta-tags"></span></div>
          </div>

          <div id="article-featured-image" class="marcie-cover-host hidden" aria-live="polite"></div>

          <div data-article-divider class="h-px w-full bg-slate-200 mb-10"></div>

          <div id="article-body-container" class="outline-none focus:ring-2 focus:ring-teal-100 rounded px-2 -mx-2" contenteditable="true" spellcheck="false">
            <!-- Bloques inyectados dinámicamente -->
          </div>

          <div data-article-sources class="mt-16 pt-10 border-t border-slate-200/60">
            <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <i data-lucide="book-open" class="w-5 h-5 text-slate-400"></i>
                <h4 class="text-lg font-bold tracking-tight text-slate-800">Referencias bibliográficas</h4>
              </div>
              <button id="btn-source-citation-format" type="button" class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-semibold text-slate-600 shadow-xs transition-all hover:border-teal-300 hover:bg-teal-50 hover:text-teal-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2" aria-pressed="false" title="Cambiar fuentes a formato APA">
                <i data-lucide="book-type" class="h-3.5 w-3.5"></i>
                <span id="source-citation-format-label">APA 7</span>
              </button>
            </div>
            <ul id="article-sources-list" class="article-sources-list grid grid-cols-1 sm:grid-cols-2 gap-3">
              <!-- Fuentes inyectadas dinámicamente -->
            </ul>
          </div>
          <section id="article-evidence-panel" class="article-evidence-shell mt-8" aria-live="polite" data-state="pending">
            <div class="article-evidence-header">
              <div class="article-evidence-status-mark" aria-hidden="true"><i data-lucide="shield-check"></i></div>
              <div class="min-w-0 flex-1"><p class="article-evidence-kicker">Control de calidad automático</p><h4 id="article-evidence-summary" class="article-evidence-summary">Preparando comprobación…</h4></div>
              <button id="btn-verify-evidence" type="button" class="article-evidence-retry hidden">Reintentar</button>
            </div>
            <div id="article-evidence-blockers" class="article-evidence-notice hidden"></div>
            <div id="article-evidence-matrix" class="article-evidence-content"></div>
          </section>
        </article>
      </div>

      <!-- Vista 2: Vista Estructurada (JSON Canónico ArticleDocument) -->
      <div id="structured-view" class="flex-1 overflow-y-auto p-8 max-w-5xl mx-auto w-full hidden">
        <div class="bg-slate-900 text-slate-100 p-6 rounded-xl font-mono text-xs overflow-x-auto shadow-inner">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800 text-slate-400">
            <span>ArticleDocument JSON (Colección: MarcieBlogEditor)</span>
            <span>Schema v1.0</span>
          </div>
          <pre id="structured-json-code">{}</pre>
        </div>
      </div>

      <!-- Vista 3: SEO -->
      <div id="seo-view" class="flex-1 overflow-y-auto p-8 max-w-3xl mx-auto w-full hidden">
        <div class="bg-white border border-border rounded-xl p-6 shadow-sm flex flex-col gap-4">
          <h3 class="font-semibold text-slate-800 text-lg">Optimización y Metadatos SEO</h3>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase">Título SEO</label>
            <input id="seo-title-input" type="text" class="input-field mt-1" placeholder="Título para buscadores..." maxlength="70" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase">Meta Descripción</label>
            <textarea id="seo-description-input" class="input-field mt-1 h-24" maxlength="155" placeholder="Descripción resumida para Google..."></textarea>
            <p id="seo-description-counter" class="mt-1 text-right text-[10px] text-slate-400">0 / 155</p>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase">Palabras Clave</label>
            <input id="seo-keywords-input" type="text" class="input-field mt-1" placeholder="Separadas por comas" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase">Slug</label>
            <input id="seo-slug-input" type="text" class="input-field mt-1" placeholder="titulo-del-articulo" />
          </div>
        </div>
      </div>
    </section>

    <!-- Resizer Derecho -->
    <div id="right-resizer" class="panel-resizer panel-resizer-right" role="separator" aria-orientation="vertical" aria-label="Redimensionar panel de asistente IA" title="Arrastra para redimensionar (Doble clic para restaurar)"></div>

    <!-- Right Panel: Asistente editorial IA -->
    <aside id="right-panel" class="w-[380px] bg-slate-50 border-l border-border flex flex-col shrink-0 overflow-hidden relative z-10">
      <!-- Grid de Acciones Editoriales Rápidas (Header fijo del panel) -->
      <div id="editorial-actions-grid" class="editorial-actions-grid">
          <!-- 1. Exportar -->
          <button
            id="btn-export-html-header"
            type="button"
            class="editorial-action-tile group"
            title="Exportar artículos"
            aria-label="Exportar artículos"
          >
            <div class="editorial-action-tile__icon text-[#007b8b]">
              <i data-lucide="file-down" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">Exportar</span>
            <span class="editorial-action-tile__desc">HTML o Word</span>
          </button>

          <!-- 2. Publicar WordPress -->
          <button
            id="btn-publish-wordpress-header"
            type="button"
            class="editorial-action-tile group"
            title="Publicar o programar entrada en WordPress"
            aria-label="Publicar en WordPress"
          >
            <div class="editorial-action-tile__icon text-[#2563eb]">
              <i data-lucide="send" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">WordPress</span>
            <span class="editorial-action-tile__desc">Publicar entrada</span>
          </button>

          <!-- 3. Plantillas de Artículo -->
          <button
            id="btn-article-templates"
            type="button"
            class="editorial-action-tile group"
            title="Elegir plantilla visual y formato del artículo"
            aria-label="Elegir plantilla de artículo"
          >
            <div class="editorial-action-tile__icon text-[#9333ea]">
              <i data-lucide="palette" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">Plantillas</span>
            <span class="editorial-action-tile__desc">Diseño visual</span>
          </button>

          <!-- 4. Reconfigurar Sesión -->
          <button
            id="btn-reconfigure-session-grid"
            type="button"
            class="editorial-action-tile group disabled:opacity-50 disabled:cursor-not-allowed"
            title="Modificar configuración y volver a generar la sesión"
            aria-label="Configurar y volver a crear sesión"
            disabled
          >
            <div class="editorial-action-tile__icon text-[#d97706]">
              <i data-lucide="settings-2" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">Configurar</span>
            <span class="editorial-action-tile__desc">Volver a crear</span>
          </button>

          <!-- 5. Crear Guión -->
          <button
            id="btn-create-video-script"
            type="button"
            class="editorial-action-tile group"
            title="Crear guión de video según el público seleccionado"
            aria-label="Crear guión de video"
          >
            <div class="editorial-action-tile__icon text-[#e11d48]">
              <i data-lucide="clapperboard" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">Crear Guión</span>
            <span class="editorial-action-tile__desc">Video por público</span>
          </button>

          <!-- 6. Ver Guiones de Video (visible cuando existan guiones) -->
          <button
            id="btn-view-video-scripts-grid"
            type="button"
            class="editorial-action-tile group hidden"
            title="Ver guiones de video generados"
            aria-label="Ver guiones de video generados"
          >
            <div class="editorial-action-tile__icon text-[#7c3aed]">
              <i data-lucide="video" class="w-4 h-4"></i>
            </div>
            <span class="editorial-action-tile__title">Guiones Video</span>
            <span id="video-scripts-count-desc" class="editorial-action-tile__desc">0 disponibles</span>
          </button>
      </div>

      <div class="right-panel-actions-separator" aria-hidden="true"></div>

      <div id="right-panel-content" class="p-5 flex flex-col gap-4 flex-1 min-h-0 overflow-y-auto">
        <div id="marcie-agent-chat-host" class="flex min-h-0 flex-1 flex-col" aria-live="polite"></div>
      </div>
    </aside>
    </div> <!-- /workspace-fullscreen-area -->
    </main>
    <div id="marcie-mobile-panel-backdrop" class="marcie-mobile-panel-backdrop" hidden></div>
    <nav id="marcie-mobile-dock" class="marcie-mobile-dock" aria-label="Paneles del editor">
      <button id="btn-mobile-sessions" type="button" aria-controls="left-panel" aria-expanded="false" aria-label="Abrir sesiones" title="Sesiones">
        <i data-lucide="list" aria-hidden="true"></i><span>Sesiones</span>
      </button>
      <button id="btn-mobile-assistant" type="button" aria-controls="right-panel" aria-expanded="false" aria-label="Abrir agente Marcie" title="Agente Marcie">
        <i data-lucide="message-circle" aria-hidden="true"></i><span>Marcie</span>
      </button>
    </nav>
  </div>

  <!-- Scripts principales de navegación y Chrome Layout de CharlyBrown -->
  <script data-theme-manager="1" src="/js/themeManager.js"></script>
  <script type="module" src="/js/chromeLayout.js"></script>
  <script type="module" src="/js/sidebar.js"></script>
  <script src="/vendor/jszip/jszip.min.js"></script>
  <script src="/js/html-docx.js"></script>

  <!-- Script principal de la aplicación Marcie Blog Editor -->
  <script type="module" src="/MarcieBlogEditor/js/editor-app.js?v=20260928r6"></script>
</body>
</html>
