      <stop offset="0.75" stop-color="#87d7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#87d7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
