services:
  - type: web
    name: charly-brown-gemini-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm run verify:chromium --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: API_HOST
        value: 0.0.0.0
      - key: BACKEND_SERVICE_ROLE
        value: gemini
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://charly-brown.web.app,https://charly-brown.firebaseapp.com,https://*.onrender.com
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://charly-brown-gemini-backend.onrender.com
      - key: MONTAGE_EXPORT_SCENE_RENDER_TIMEOUT_MS
        value: 360000
      - key: RENDER_KEY_VALUE_CONNECTION_STRING
        fromService:
          type: keyvalue
          name: charly-brown-podcaster-queue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: web
    name: gemini-veo
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm run verify:chromium --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: API_HOST
        value: 0.0.0.0
      - key: BACKEND_SERVICE_ROLE
        value: gemini-veo
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://charly-brown.web.app,https://charly-brown.firebaseapp.com,https://*.onrender.com
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://gemini-veo.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: web
    name: snoopy-export
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm run verify:chromium --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: API_HOST
        value: 0.0.0.0
      - key: BACKEND_SERVICE_ROLE
        value: export
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://charly-brown.web.app,https://charly-brown.firebaseapp.com,https://*.onrender.com
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://snoopy-export.onrender.com
      - key: MONTAGE_EXPORT_SCENE_RENDER_TIMEOUT_MS
        value: 900000
      - key: MONTAGE_EXPORT_MAX_CONCURRENT
        value: 1
      - key: MONTAGE_EXPORT_WORKER_CONCURRENCY
        value: 1
      - key: MONTAGE_EXPORT_REQUIRE_QUEUE
        value: false
      - key: MONTAGE_EXPORT_USE_QUEUE
        value: false
      - key: RENDER_KEY_VALUE_CONNECTION_STRING
        fromService:
          type: keyvalue
          name: charly-brown-podcaster-queue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: worker
    name: charly-brown-podcaster-export-worker
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm run verify:chromium --prefix backend
    startCommand: node backend/workers/podcaster-montage-export-worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: BACKEND_SERVICE_ROLE
        value: export
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://snoopy-export.onrender.com
      - key: MONTAGE_EXPORT_SCENE_RENDER_TIMEOUT_MS
        value: 900000
      - key: MONTAGE_EXPORT_MAX_CONCURRENT
        value: 1
      - key: MONTAGE_EXPORT_WORKER_CONCURRENCY
        value: 1
      - key: MONTAGE_EXPORT_REQUIRE_QUEUE
        value: true
      - key: RENDER_KEY_VALUE_CONNECTION_STRING
        fromService:
          type: keyvalue
          name: charly-brown-podcaster-queue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: keyvalue
    name: charly-brown-podcaster-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
