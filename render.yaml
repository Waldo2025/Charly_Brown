services:
  - type: web
    name: charly-brown-gemini-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && mkdir -p /opt/render/project/src/backend/.playwright-browsers && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npx --prefix backend playwright install chromium && find /opt/render/project/src/backend/.playwright-browsers -maxdepth 3 -type f -path '*/chrome-linux64/chrome' -print -quit | grep -q .
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: API_HOST
        value: 0.0.0.0
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://charly-brown.web.app,https://charly-brown.firebaseapp.com,https://*.onrender.com
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://charly-brown-gemini-backend.onrender.com
      - key: MONTAGE_EXPORT_SCENE_RENDER_TIMEOUT_MS
        value: 360000
      - key: RENDER_KEY_VALUE_CONNECTION_STRING
        fromService:
          type: keyvalue
          name: charly-brown-podcaster-queue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: worker
    name: charly-brown-podcaster-export-worker
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npm install --prefix backend && mkdir -p /opt/render/project/src/backend/.playwright-browsers && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/backend/.playwright-browsers npx --prefix backend playwright install chromium && find /opt/render/project/src/backend/.playwright-browsers -maxdepth 3 -type f -path '*/chrome-linux64/chrome' -print -quit | grep -q .
    startCommand: node backend/workers/podcaster-montage-export-worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/.playwright-browsers
      - key: FIREBASE_PROJECT_ID
        value: charly-brown
      - key: FIREBASE_STORAGE_BUCKET
        value: charly-brown.firebasestorage.app
      - key: PUBLIC_BACKEND_BASE_URL
        value: https://charly-brown-gemini-backend.onrender.com
      - key: MONTAGE_EXPORT_SCENE_RENDER_TIMEOUT_MS
        value: 360000
      - key: RENDER_KEY_VALUE_CONNECTION_STRING
        fromService:
          type: keyvalue
          name: charly-brown-podcaster-queue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: keyvalue
    name: charly-brown-podcaster-queue
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
