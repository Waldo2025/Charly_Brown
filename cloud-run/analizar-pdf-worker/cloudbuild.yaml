steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - cloud-run/analizar-pdf-worker/Dockerfile
      - --tag
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - node
      - ${_IMAGE}
      - -e
      - "require('./backend/server.js'); process.exit(0)"
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/charly-brown/charly-backends/analizar-pdf-worker:latest
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
