steps:
  - name: gcr.io/cloud-builders/docker
    id: build-montage-worker
    args:
      - build
      - --file
      - cloud-run/montage-worker/Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/montage-worker:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    id: build-live-proxy
    args:
      - build
      - --file
      - cloud-run/live-proxy/Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/live-proxy:${_TAG}
      - cloud-run/live-proxy
  - name: gcr.io/cloud-builders/docker
    id: smoke-montage-worker
    waitFor:
      - build-montage-worker
    args:
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/montage-worker:${_TAG}
      - -c
      - node backend/scripts/install-playwright-chromium.js --verify-only && ffmpeg -hide_banner -filters 2>&1 | grep -q drawtext
  - name: gcr.io/cloud-builders/docker
    id: smoke-live-proxy
    waitFor:
      - build-live-proxy
    args:
      - run
      - --rm
      - --entrypoint
      - node
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/live-proxy:${_TAG}
      - -e
      - require('./protocol.js'); console.log('live-proxy-smoke-ok')
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/montage-worker:${_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/live-proxy:${_TAG}
substitutions:
  _TAG: phase2
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
