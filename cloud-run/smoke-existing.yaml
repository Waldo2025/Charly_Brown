steps:
  - name: gcr.io/cloud-builders/docker
    id: montage-runtime
    args:
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/montage-worker:${_MONTAGE_TAG}
      - -c
      - node backend/scripts/install-playwright-chromium.js --verify-only && ffmpeg -hide_banner -filters 2>&1 | grep -q drawtext
substitutions:
  _MONTAGE_TAG: phase2
options:
  machineType: E2_HIGHCPU_8
timeout: 1200s
