steps:
  - name: gcr.io/cloud-builders/docker
    id: montage-runtime
    args:
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/montage-worker:${_MONTAGE_TAG}
      - -c
      - node backend/scripts/install-playwright-chromium.js --verify-only && ffmpeg -hide_banner -filters 2>&1 | grep -q drawtext
  - name: gcr.io/cloud-builders/docker
    id: live-runtime
    args:
      - run
      - --rm
      - --entrypoint
      - node
      - us-central1-docker.pkg.dev/$PROJECT_ID/charly-backends/live-proxy:${_LIVE_TAG}
      - -e
      - require('./protocol.js'); require('firebase-admin/app'); require('firebase-admin/firestore'); console.log('live-runtime-ok')
substitutions:
  _MONTAGE_TAG: phase2
  _LIVE_TAG: phase2-live-fix
options:
  machineType: E2_HIGHCPU_8
timeout: 1200s
